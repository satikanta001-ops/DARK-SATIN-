<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes">
<title>DARK-SATIN</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="logo-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="logo-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1013;--s1:#16191e;--s2:#1e2229;--line:#292e37;--tx:#eceef1;--mu:#8a919d;--ac:#8fd1b0;--ac-ink:#0e1013;--pos:#6fd6a0;--neg:#ff8577;--warn:#f0b75e;--r:18px;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f4f2ec;--s1:#fff;--s2:#ece8de;--line:#e2ddd2;--tx:#1b1d20;--mu:#6d7179;--ac:#2f7d5b;--ac-ink:#fff;--pos:#1f8a55;--neg:#c9443a;--warn:#b7791f;--shadow:0 10px 30px rgba(40,30,10,.14)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Manrope',system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(var(--bg) 75%,transparent);max-width:560px;margin:0 auto}
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:10px}
.brand img{border-radius:9px}
.brand i{color:var(--ac);font-style:normal}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.icon-btn svg{width:20px;height:20px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(130px + env(safe-area-inset-bottom))}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.15}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.muted{color:var(--mu)}
.hello{margin:6px 2px 16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.link{color:var(--ac);font-weight:600;font-size:13px}
.hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--ac) 20%,var(--s1)) 0%,var(--s1) 60%)}
.label{font-size:12px;color:var(--mu);display:block}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 b{font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{color:var(--mu);font-size:14px}
p.empty.card{padding:18px 16px}
.jsnip{font-family:'Fraunces',serif;font-size:15px;line-height:1.55;color:var(--tx);opacity:.85}
.nudge{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));display:flex;align-items:center;gap:12px}
.nudge p{flex:1;font-size:13px;color:var(--mu)}
.nudge b{color:var(--tx);display:block}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card>.task:first-child,.card-h+.task,.dgroup+.task{border-top:0}
.chk{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ac-ink)}
.task.done .chk{background:var(--ac);border-color:var(--ac)}
.task.done .ttl{text-decoration:line-through;color:var(--mu)}
.tmain{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;word-break:break-word}
.meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.meta:empty{display:none}
.due-over{color:var(--neg);font-weight:600}.due-today{color:var(--ac);font-weight:600}
.pri{width:8px;height:8px;border-radius:50%;flex:none}
.p1{background:var(--neg)}.p2{background:var(--warn)}.p3{background:var(--line)}
.more{font-size:13px;color:var(--mu);padding-top:8px}
/* nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu)}
.tabs svg{width:22px;height:22px}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{color:var(--ac)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:20px;background:var(--ac);color:var(--ac-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
/* segments & chips */
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg>*{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span,.seg>button{display:block;text-align:center;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mu);width:100%;cursor:pointer}
.seg input:checked+span,.seg>button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg em{font-style:normal;opacity:.6;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.dash{border-style:dashed;color:var(--mu)}
.acct{flex:none;min-width:132px;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left}
.acct small{display:block;color:var(--mu);font-size:12px}
.acct b{font-variant-numeric:tabular-nums}
.acct.add{display:grid;place-items:center;min-width:64px;color:var(--mu);font-size:22px;border-style:dashed}
/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.datebar>button{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:20px}
.datebar>div{text-align:center}
.datebar b{display:block;font-size:17px}
.datebar small{color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum>div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.sum b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
/* transactions */
.dgroup{font-size:12px;font-weight:700;color:var(--mu);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.card .dgroup{margin:14px 0 2px}
.card .dgroup:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.tx .ic{width:36px;height:36px;border-radius:11px;background:var(--s2);display:grid;place-items:center;font-weight:700;flex:none;color:var(--mu)}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600}
.tx .m small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* budgets */
.brow{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.brow:first-child,.card-h+.brow{border-top:0}
.bt{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;gap:8px}
.bt small{color:var(--mu);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--neg)}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
/* journal */
.moods{display:flex;gap:6px;margin-bottom:12px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:14px;background:var(--s1);border:1px solid var(--line);filter:grayscale(1);opacity:.5;transition:.15s}
.mood.on{filter:none;opacity:1;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--s1))}
.jlabel{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
textarea.jt{display:block;width:100%;min-height:220px;field-sizing:content;resize:none;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-family:'Fraunces',serif;font-size:17px;line-height:1.6;outline:none}
textarea.jp{min-height:110px;font-family:'Manrope',sans-serif;font-size:15px;line-height:1.7}
textarea.jt:focus{border-color:var(--ac)}
.saved{font-size:12px;color:var(--mu)}
.jentry{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.jentry b{font-size:14px}
.jentry p{color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
/* sheet & forms */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:10px;background:var(--s1);font-size:15px;color:var(--mu)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--mu)}
.f input,.f select,.f textarea{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;min-height:48px}
.f textarea{min-height:72px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.amt{width:100%;font-size:38px;font-weight:700;text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 0 10px;margin-bottom:16px;outline:none;font-variant-numeric:tabular-nums}
.amt:focus{border-color:var(--ac)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;text-align:center}
.btn.primary{background:var(--ac);color:var(--ac-ink)}
.btn.danger{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg);flex:.6}
.btn.ghost{background:var(--s1);border:1px solid var(--line)}
.btn.small{flex:none;padding:10px 14px;font-size:13px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{padding:18px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left;font-weight:700}
.quick small{display:block;color:var(--mu);font-weight:500;font-size:12px;margin-top:2px}
.quick .e{font-size:22px;display:block;margin-bottom:6px;color:var(--ac)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.setrow>span{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* login */
body.pre .top,body.pre main,body.pre .fab,body.pre .tabs{display:none!important}
.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
body.pre .gate{display:flex}
.gate-in{width:100%;max-width:380px}
.glogo{width:76px;height:76px;border-radius:22px;display:block;margin:0 auto 16px;box-shadow:var(--shadow)}
.gname{text-align:center;font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.gname i{color:var(--ac);font-style:normal}
.gsub{text-align:center;color:var(--mu);font-size:14px;margin-bottom:22px;line-height:1.6}
.gsub b{color:var(--tx)}
.gok{background:color-mix(in srgb,var(--ac) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.gerr{color:var(--neg);font-size:13px;min-height:18px;margin:2px 2px 10px}
.glinks{display:flex;justify-content:space-between;margin-top:16px}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--mu);padding:8px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;margin:8px auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.acctbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.acctbox b{display:block;word-break:break-all;margin:2px 0 10px}
.acctbtns{display:flex;gap:8px}
.btn.danger.small{flex:none}
</style>
</head>
<body class="pre">
<div class="gate"><div class="gate-in"><img src="logo.svg" class="glogo" alt=""><h1 class="gname">DARK-<i>SATIN</i></h1><div id="gateBody"></div></div></div>

<main id="view"></main>

<button class="fab" id="fab" data-act="fab" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="tab" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M16 12.5h2M2.5 10h19"/></svg>Money</button>
  <button data-act="tab" data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-3M8 8h7M8 12h5"/></svg>Journal</button>
  <button data-act="tab" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>Tasks</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot, setDoc, writeBatch, terminate, clearIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid_ = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ds(d); };
const monthOf = s => s.slice(0, 7);
const addMonths = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const INR = new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:0, maximumFractionDigits:2});
const money = n => INR.format(n || 0);
const relLabel = s => { const t = today(); if (s === t) return 'Today'; if (s === addDays(t,-1)) return 'Yesterday'; if (s === addDays(t,1)) return 'Tomorrow'; return parseD(s).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}); };
const fmtLong = s => parseD(s).toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'});
const monthName = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); };
const fmtTime = s => { const [h,m] = s.split(':').map(Number); return `${(h%12)||12}:${pad(m)} ${h<12?'am':'pm'}`; };
const greet = () => { const h = new Date().getHours(); return h<5 ? 'Late night' : h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening'; };
const MOODS = ['😞','😕','😐','🙂','😄'];
let tT; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => el.classList.remove('show'), 2200); }
// Key-order-independent JSON, so we can tell what really changed
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
  : v && typeof v === 'object' ? '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'
  : JSON.stringify(v === undefined ? null : v);

/* ---------- data model ---------- */
const defaults = () => ({
  version: 1,
  accounts: [{id:'cash', name:'Cash', type:'cash', opening:0}, {id:'bank', name:'Bank', type:'bank', opening:0}],
  categories: {
    expense: ['Food','Groceries','Transport','Bills','Rent','Shopping','Health','Family','Fun','Other'],
    income: ['Salary','Business','Trading','Interest','Other']
  },
  transactions: [], budgets: {}, journal: {},
  projects: [{id:'personal', name:'Personal'}],
  tasks: [], lastBackup: null
});
let D = defaults();
function migrate(d){ const base = defaults(); for (const k in base) if (d[k] === undefined || d[k] === null && k !== 'lastBackup') d[k] = base[k]; if (!d.projects.length) d.projects = base.projects; if (!d.accounts.length) d.accounts = base.accounts; return d; }
const settingsOf = () => ({version:D.version || 1, accounts:D.accounts, categories:D.categories, budgets:D.budgets, projects:D.projects, lastBackup:D.lastBackup || null});

/* ---------- Firebase ---------- */
const configured = !String(firebaseConfig.apiKey).startsWith('PASTE');
let app, auth, db, user = null, ready = false, unsubs = [];
const got = {settings:false, transactions:false, tasks:false, journal:false};
let synced = {transactions:new Map(), tasks:new Map(), journal:new Map(), settings:null};
const uref = (...p) => doc(db, 'users', user.uid, ...p);

// save(): compare current data with what Firestore last confirmed, write only the differences.
function save(){
  if (!ready || !user) return;
  const ops = [];
  for (const col of ['transactions','tasks']) {
    const cur = new Map(D[col].map(x => [x.id, x]));
    for (const [id, x] of cur) { const j = stable(x); if (synced[col].get(id) !== j) { ops.push(['set', col, id, x]); synced[col].set(id, j); } }
    for (const id of [...synced[col].keys()]) if (!cur.has(id)) { ops.push(['del', col, id]); synced[col].delete(id); }
  }
  for (const [date, e] of Object.entries(D.journal)) { const x = {...e, date}, j = stable(x); if (synced.journal.get(date) !== j) { ops.push(['set', 'journal', date, x]); synced.journal.set(date, j); } }
  for (const date of [...synced.journal.keys()]) if (!D.journal[date]) { ops.push(['del', 'journal', date]); synced.journal.delete(date); }
  const s = settingsOf(), sj = stable(s);
  if (synced.settings !== sj) { ops.push(['set', 'meta', 'settings', s]); synced.settings = sj; }
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(([op, col, id, x]) => op === 'set' ? b.set(uref(col, id), JSON.parse(JSON.stringify(x))) : b.delete(uref(col, id)));
    b.commit().catch(err => { console.error(err); toast('Sync failed: ' + (err.code || 'error')); });
  }
}

function onRemote(snap){
  if (!ready || snap.metadata.hasPendingWrites) return;         // our own write echoing back
  if ($('#sheetBg').classList.contains('open')) return;          // don't yank a form away
  const ae = document.activeElement; if (ae && (ae.id === 'jText' || ae.id === 'jPlan')) return;
  flushJournal(); render();
}
function maybeReady(){
  if (ready || !Object.values(got).every(Boolean)) return;
  ready = true; document.body.classList.remove('pre'); render(); offerLocalImport();
}
function listen(){
  const err = e => { console.error(e); gate('error', {msg: e.code === 'permission-denied' ? 'Access denied. Check that the Firestore rules are published and your email is verified.' : 'Could not load your data (' + (e.code || 'error') + ').'}); };
  unsubs.push(onSnapshot(uref('meta', 'settings'), snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;                         // wait for the server before deciding it's empty
      setDoc(uref('meta', 'settings'), settingsOf()).catch(err);   // brand-new account
      return;
    }
    const s = snap.data(), base = defaults();
    D.version = s.version || 1; D.accounts = s.accounts?.length ? s.accounts : base.accounts;
    D.categories = s.categories || base.categories; D.budgets = s.budgets || {};
    D.projects = s.projects?.length ? s.projects : base.projects; D.lastBackup = s.lastBackup || null;
    synced.settings = stable(settingsOf());
    got.settings = true; maybeReady(); onRemote(snap);
  }, err));
  for (const col of ['transactions','tasks']) {
    unsubs.push(onSnapshot(collection(db, 'users', user.uid, col), snap => {
      D[col] = snap.docs.map(d => d.data());
      synced[col] = new Map(D[col].map(x => [x.id, stable(x)]));
      got[col] = true; maybeReady(); onRemote(snap);
    }, err));
  }
  unsubs.push(onSnapshot(collection(db, 'users', user.uid, 'journal'), snap => {
    D.journal = {}; synced.journal = new Map();
    snap.docs.forEach(d => { const x = d.data(); synced.journal.set(d.id, stable(x)); const {date, ...rest} = x; D.journal[d.id] = rest; });
    got.journal = true; maybeReady(); onRemote(snap);
  }, err));
}

// One-time: move data saved on this phone by the offline version into the account
function offerLocalImport(){
  let raw; try { raw = localStorage.getItem('daybook.v1'); if (!raw || localStorage.getItem('daybook.v1.moved')) return; } catch (_) { return; }
  const cloudEmpty = !D.transactions.length && !D.tasks.length && !Object.keys(D.journal).length;
  if (!cloudEmpty) return;
  let old; try { old = JSON.parse(raw); } catch (_) { return; }
  const n = (old.transactions || []).length + (old.tasks || []).length + Object.keys(old.journal || {}).length;
  if (!n) return;
  if (confirm(`Found ${n} items saved on this phone by the earlier offline version. Move them into this account?`)) { D = migrate(old); save(); render(); toast('Moved into your account'); }
  try { localStorage.setItem('daybook.v1.moved', user.uid); } catch (_) {}
}

const AUTH_MSG = {

const authMsg = e => AUTH_MSG[e.code] || 'Something went wrong (' + (e.code || 'error') + ').';
const pwField = (name, label, ac) => `<label class="f"><span>${label}</span><div class="pw"><input name="${name}" type="password" autocomplete="${ac}" required><button type="button" data-act="pwshow">Show</button></div></label>`;
function gate(view, o = {}){
  document.body.classList.add('pre');
  const b = $('#gateBody');
  const form = (title, inner, btn) => `<p class="gsub">${title}</p><form id="gf" data-view="${view}" novalidate>${inner}<div class="gerr" id="gerr">${o.err ? esc(o.err) : ''}</div><button type="submit" class="btn primary" style="width:100%">${btn}</button></form>`;
  if (view === 'loading') b.innerHTML = `<div class="spin"></div><p class="gsub">${esc(o.msg || 'Loading…')}</p>`;
  else if (view === 'setup') b.innerHTML = `<p class="gsub">Almost there. Paste your Firebase config at the top of the script in <b>index.html</b>, then reload.</p>`;
  else if (view === 'error') b.innerHTML = `<p class="gsub">${esc(o.msg)}</p><button class="btn ghost" style="width:100%" data-act="signout">Sign out</button>`;
  else if (view === 'signin') b.innerHTML = (o.msg ? `<p class="gok">${esc(o.msg)}</p>` : '') + form('Sign in to your space',
      `<label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" value="${esc(o.email || '')}" required></label>${pwField('password','Password','current-password')}`, 'Sign in')
      + `<div class="glinks"><button class="link" data-act="gview" data-v="reset">Forgot password?</button><button class="link" data-act="gview" data-v="signup">Create account</button></div>`;
  else if (view === 'signup') b.innerHTML = form('Create your private account',
      `<label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required></label>${pwField('password','Password (8+ characters, letters and numbers)','new-password')}${pwField('confirm','Confirm password','new-password')}`, 'Create account')
      + `<div class="glinks"><span></span><button class="link" data-act="gview" data-v="signin">I have an account</button></div>`;
  else if (view === 'reset') b.innerHTML = form("We'll email you a link to set a new password",
      `<label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required></label>`, 'Send reset link')
      + `<div class="glinks"><span></span><button class="link" data-act="gview" data-v="signin">Back to sign in</button></div>`;
  else if (view === 'verify') b.innerHTML = `<p class="gsub">We sent a verification link to<br><b>${esc(o.email)}</b>.<br>Open it, then come back here.</p>
      <div class="gerr" id="gerr"></div>
      <button class="btn primary" style="width:100%;margin-bottom:10px" data-act="verified">I've verified my email</button>
      <div class="glinks"><button class="link" data-act="resend">Resend email</button><button class="link" data-act="signout">Use another account</button></div>`;
  const first = b.querySelector('input'); if (first && !first.value) setTimeout(() => first.focus(), 50);
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'gf') return;
  e.preventDefault();
  const f = e.target, fd = Object.fromEntries(new FormData(f)), err = $('#gerr'), btn = f.querySelector('button[type=submit]');
  const email = (fd.email || '').trim();
  if (!email) { err.textContent = 'Enter your email.'; return; }
  err.textContent = ''; btn.disabled = true;
  try {
    const v = f.dataset.view;
    if (v === 'signin') await signInWithEmailAndPassword(auth, email, fd.password || '');
    else if (v === 'signup') {
      const p = fd.password || '';
      if (p !== fd.confirm) throw {code:'x/mismatch'};
      if (p.length < 8 || !/[A-Za-z]/.test(p) || !/\d/.test(p)) throw {code:'x/weak'};
      const c = await createUserWithEmailAndPassword(auth, email, p);
      await sendEmailVerification(c.user);
      gate('verify', {email});
    } else if (v === 'reset') {
      try { await sendPasswordResetEmail(auth, email); } catch (ex) { if (ex.code !== 'auth/user-not-found') throw ex; }
      gate('signin', {email, msg:'If an account exists for that email, a reset link is on its way.'});
    }
  } catch (ex) { if ($('#gerr')) $('#gerr').textContent = authMsg(ex); }
  finally { btn.disabled = false; }
});
async function startUser(u){
  if (user && user.uid === u.uid) return;
  user = u;
  gate('loading', {msg:'Syncing your data…'});
  listen();
}
async function doSignOut(ask){
  if (ask && !confirm('Sign out of DARK-SATIN on this phone?')) return;
  unsubs.forEach(f => { try { f(); } catch (_) {} });
  try { await signOut(auth); } catch (_) {}
  // wipe this account's offline copy so the next person on this phone can't see it
  try { await terminate(db); await clearIndexedDbPersistence(db); } catch (_) {}
  location.reload();
}

/* ---------- MONEY (always derived from the ledger) ---------- */
function balances(){
  const b = {}; D.accounts.forEach(a => b[a.id] = +a.opening || 0);
  D.transactions.forEach(t => {
    const a = +t.amount || 0;
    if (t.type === 'income') b[t.account] = (b[t.account]||0) + a;
    else if (t.type === 'expense') b[t.account] = (b[t.account]||0) - a;
    else if (t.type === 'transfer') { b[t.account] = (b[t.account]||0) - a; b[t.to] = (b[t.to]||0) + a; }
  });
  return b;
}
function monthTotals(ym){
  let inc = 0, exp = 0; const byCat = {};
  D.transactions.forEach(t => {
    if (monthOf(t.date) !== ym) return;
    const a = +t.amount || 0;
    if (t.type === 'income') inc += a;
    else if (t.type === 'expense') { exp += a; byCat[t.category] = (byCat[t.category]||0) + a; }
  });
  return {inc, exp, byCat};
}
function vMoney(){
  const bal = balances(), mt = monthTotals(S.ym), cm = monthOf(today());
  const accts = D.accounts.map(a => `<button class="acct" data-act="editAccount" data-id="${a.id}"><small>${esc(a.name)}</small><b class="${(bal[a.id]||0)<0?'neg':''}">${money(bal[a.id])}</b></button>`).join('')
    + `<button class="acct add" data-act="newAccount" aria-label="Add account">+</button>`;
  let h = `<div class="chips">${accts}</div>
  <div class="datebar"><button data-act="month" data-n="-1" aria-label="Previous month">‹</button><div><b>${monthName(S.ym)}</b><small>${S.ym===cm?'This month':'&nbsp;'}</small></div><button data-act="month" data-n="1" ${S.ym>=cm?'disabled':''} aria-label="Next month">›</button></div>
  <div class="sum"><div><span class="label">In</span><b class="pos">${money(mt.inc)}</b></div><div><span class="label">Out</span><b class="neg">${money(mt.exp)}</b></div><div><span class="label">Net</span><b>${money(mt.inc-mt.exp)}</b></div></div>
  <div class="seg"><button class="${S.moneyView==='txns'?'on':''}" data-act="mview" data-v="txns">Transactions</button><button class="${S.moneyView==='budgets'?'on':''}" data-act="mview" data-v="budgets">Budgets</button></div>`;
  if (S.moneyView === 'txns') {
    const txs = D.transactions.filter(t => monthOf(t.date) === S.ym).sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
    if (!txs.length) h += `<p class="empty card">No entries in ${monthName(S.ym)}. Tap + to add one.</p>`;
    else { let cur = null; txs.forEach(t => { if (t.date !== cur) { cur = t.date; h += `<div class="dgroup">${relLabel(t.date)}</div>`; } h += txRow(t); }); }
  } else {
    const cats = [...new Set([...D.categories.expense, ...Object.keys(mt.byCat), ...Object.keys(D.budgets)])];
    const rows = cats.map(c => ({c, s:mt.byCat[c]||0, l:D.budgets[c]||0}))
      .sort((a,b) => (b.l?1:0) - (a.l?1:0) || (a.l && b.l ? b.s/b.l - a.s/a.l : b.s - a.s));
    const totalB = rows.reduce((s,r) => s + r.l, 0), spentB = rows.filter(r => r.l).reduce((s,r) => s + r.s, 0);
    if (totalB) {
      const p = Math.min(spentB/totalB, 1), cls = spentB > totalB ? 'over' : p > .8 ? 'warn' : '';
      h += `<div class="card"><div class="bt"><span>All budgets</span><span>${money(spentB)} <small>/ ${money(totalB)}</small></span></div><div class="bar ${cls}"><i style="width:${p*100}%"></i></div><p class="hint">${spentB>totalB ? money(spentB-totalB)+' over' : money(totalB-spentB)+' left'} in ${monthName(S.ym)}</p></div>`;
    } else h += `<p class="hint" style="margin:0 2px 10px">Tap a category to set a monthly limit.</p>`;
    h += `<div class="card">${rows.map(r => barRow(r.c, r.s, r.l)).join('')}</div>`;
  }
  return h;
}
function txRow(t){
  const an = id => D.accounts.find(a => a.id === id)?.name || 'Deleted account';
  const tr = t.type === 'transfer';
  const title = tr ? `${an(t.account)} → ${an(t.to)}` : t.category;
  const sub = [t.note, tr ? 'Transfer' : an(t.account)].filter(Boolean).join(' · ');
  const amt = tr ? money(t.amount) : (t.type === 'income' ? '+' : '−') + money(t.amount);
  return `<button class="tx" data-act="editTxn" data-id="${t.id}"><span class="ic">${tr ? '⇄' : esc((t.category||'?')[0])}</span><span class="m"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="a ${t.type==='income'?'pos':''}">${amt}</span></button>`;
}
function barRow(cat, spent, limit){
  const p = limit ? Math.min(spent/limit, 1) : 0, over = limit && spent > limit, cls = over ? 'over' : p > .8 ? 'warn' : '';
  return `<div class="brow" data-act="editBudget" data-cat="${esc(cat)}"><div class="bt"><span>${esc(cat)}</span><span class="${over?'neg':''}">${money(spent)}${limit ? ` <small>/ ${money(limit)}</small>` : ''}</span></div>${limit ? `<div class="bar ${cls}"><i style="width:${p*100}%"></i></div>` : ''}</div>`;
}

/* ---------- JOURNAL ---------- */
function jEntry(d, create){ let e = D.journal[d]; if (!e && create) e = D.journal[d] = {text:'', plan:'', mood:0, planSent:[], updated:Date.now()}; return e; }
function cleanEntry(d){ const e = D.journal[d]; if (e && !e.text.trim() && !e.plan.trim() && !e.mood) delete D.journal[d]; }
function unsentPlan(d){
  const e = D.journal[d]; if (!e) return [];
  const sent = new Set(e.planSent || []);
  return (e.plan || '').split('\n').map(s => s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(s => s && !sent.has(s));
}
function vJournal(){

}
let jTimer = null;
function flushJournal(){
  if (S.tab !== 'journal') return;
  const tx = $('#jText'), pl = $('#jPlan'); if (!tx) return;
  clearTimeout(jTimer);
  const text = tx.value, plan = pl.value;
  if (!D.journal[S.jDate] && !text.trim() && !plan.trim()) return;
  const e = jEntry(S.jDate, true);
  if (e.text === text && e.plan === plan) return;
  e.text = text; e.plan = plan; e.updated = Date.now();
  cleanEntry(S.jDate); save();
  const s = $('#jSaved'); if (s) s.textContent = 'Saved';
}
function updatePlanBtn(){
  const b = $('#planBtn'); if (!b) return;
  const n = unsentPlan(S.jDate).length;
  b.disabled = !n;
  b.textContent = n ? `Add ${n} to tasks for ${relLabel(addDays(S.jDate,1))}` : 'Plan lines become tasks';
}
function bindJournal(){
  ['#jText','#jPlan'].forEach(sel => {
    $(sel).addEventListener('input', () => {
      $('#jSaved').textContent = 'Saving…';
      clearTimeout(jTimer);
      jTimer = setTimeout(() => { flushJournal(); updatePlanBtn(); }, 700);
    });
    $(sel).addEventListener('blur', () => { flushJournal(); updatePlanBtn(); });
  });
  updatePlanBtn();
}
function planToTasks(){
  flushJournal();
  const lines = unsentPlan(S.jDate); if (!lines.length) return toast('Nothing new to send');
  const e = jEntry(S.jDate, true), due = addDays(S.jDate, 1);
  lines.forEach(title => D.tasks.push({id:uid_(), title, project:D.projects[0].id, due, time:'', priority:2, note:'From journal', done:false, doneAt:null, created:Date.now()}));
  e.planSent = [...(e.planSent || []), ...lines];
  save(); updatePlanBtn();
  toast(`${lines.length} task${lines.length>1?'s':''} added for ${relLabel(due)}`);
}

/* ---------- TASKS ---------- */
const byDue = (a,b) => ((a.due||'9999') + (a.time||'99')).localeCompare((b.due||'9999') + (b.time||'99')) || (a.priority - b.priority);
function dueBadge(x){
  if (!x.due) return '';
  const t = today(), tm = x.time ? ' · ' + fmtTime(x.time) : '';
  if (x.done) return `<span>${relLabel(x.due)}</span>`;
  if (x.due < t) return `<span class="due-over">Overdue · ${relLabel(x.due)}</span>`;
  if (x.due === t) return `<span class="due-today">Today${tm}</span>`;
  return `<span>${relLabel(x.due)}${tm}</span>`;
}
function taskRow(x){
  const pn = (S.proj === 'all' && D.projects.length > 1) ? `<span>${esc(D.projects.find(p => p.id === x.project)?.name || '')}</span>` : '';
  return `<div class="task ${x.done?'done':''}"><button class="chk" data-act="toggleTask" data-id="${x.id}" aria-label="Mark done">${x.done?'✓':''}</button><div class="tmain" data-act="editTask" data-id="${x.id}"><div class="ttl">${esc(x.title)}</div><div class="meta">${dueBadge(x)}${pn}</div></div><span class="pri p${x.priority}"></span></div>`;
}
function vTasks(){
  const t = today(), inP = x => S.proj === 'all' || x.project === S.proj;
  const open = D.tasks.filter(x => !x.done && inP(x));
  const n = {today:open.filter(x => x.due && x.due <= t).length, upcoming:open.filter(x => x.due && x.due > t).length, all:open.length};
  let list, grouped = false;
  switch (S.taskFilter) {
    case 'today': list = open.filter(x => x.due && x.due <= t).sort(byDue); break;
    case 'upcoming': list = open.filter(x => x.due && x.due > t).sort(byDue); grouped = true; break;
    case 'all': list = open.slice().sort(byDue); grouped = true; break;
    default: list = D.tasks.filter(x => x.done && inP(x)).sort((a,b) => (b.doneAt||0) - (a.doneAt||0)).slice(0, 60);
  }
  const seg = [['today','Today'],['upcoming','Upcoming'],['all','All'],['done','Done']]
    .map(([k,l]) => `<button class="${S.taskFilter===k?'on':''}" data-act="tfilter" data-v="${k}">${l}${n[k] ? ` <em>${n[k]}</em>` : ''}</button>`).join('');
  const chips = `<button class="chip ${S.proj==='all'?'on':''}" data-act="proj" data-v="all">All</button>`
    + D.projects.map(p => `<button class="chip ${S.proj===p.id?'on':''}" data-act="proj" data-v="${p.id}">${esc(p.name)}</button>`).join('')
    + (S.proj !== 'all' ? `<button class="chip dash" data-act="editProject" data-id="${S.proj}">✎ Edit</button>` : '')
    + `<button class="chip dash" data-act="newProject">+ Project</button>`;
  let body;
  if (!list.length) body = `<p class="empty card">${({today:'Clear for today.', upcoming:'Nothing scheduled ahead.', all:'No open tasks.', done:'Nothing finished yet.'})[S.taskFilter]}</p>`;
  else if (grouped) {
    let cur = null; body = '<div class="card">';
    list.forEach(x => { const g = x.due ? (x.due < t ? 'Overdue' : relLabel(x.due)) : 'No date'; if (g !== cur) { body += `<div class="dgroup">${g}</div>`; cur = g; } body += taskRow(x); });
    body += '</div>';
  } else body = `<div class="card">${list.map(taskRow).join('')}</div>`;
  return `<div class="seg">${seg}</div><div class="chips">${chips}</div>${body}`;
}

/* ---------- bottom sheet ---------- */
let sheetSubmit = null;
const head = title => `<div class="sh-h"><h2>${title}</h2><button type="button" class="x" data-act="closeSheet" aria-label="Close">✕</button></div>`;
function openSheet(html, onSubmit){
  const bg = $('#sheetBg');
  $('#sheet').innerHTML = html; $('#sheet').scrollTop = 0;
  sheetSubmit = onSubmit;
  if (!bg.classList.contains('open')) { bg.classList.add('open'); history.pushState({sheet:1}, ''); }
  document.body.classList.add('lock');
  const af = $('#sheet [autofocus]'); if (af) setTimeout(() => af.focus(), 60);
}
function hideSheet(){ $('#sheetBg').classList.remove('open'); document.body.classList.remove('lock'); sheetSubmit = null; render(); }
function closeSheet(){ if (history.state && history.state.sheet) history.back(); else hideSheet(); }
addEventListener('popstate', () => { if ($('#sheetBg').classList.contains('open')) hideSheet(); });
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
document.addEventListener('submit', e => {
  if (e.target.id !== 'sf') return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  if (sheetSubmit && sheetSubmit(fd, e.submitter) !== false) { save(); closeSheet(); render(); }
});
const actions = isNew => `<div class="actions">${isNew ? '' : '<button class="btn danger" value="del">Delete</button>'}<button class="btn primary" value="save">Save</button></div>`;
const live = (arr, id) => arr.find(x => x.id === id);   // always edit the current copy (data may have synced meanwhile)

/* ---------- forms ---------- */
function txnForm(t, type){
  const isNew = !t;
  t = t || {type:type||'expense', amount:'', account:D.accounts[0].id, to:(D.accounts[1]||D.accounts[0]).id, category:'', date:today(), note:''};
  const acc = sel => D.accounts.map(a => `<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
  openSheet(`<form id="sf">${head(isNew ? 'New entry' : 'Edit entry')}
    <div class="seg">${['expense','income','transfer'].map(k => `<label><input type="radio" name="type" value="${k}" ${t.type===k?'checked':''}><span>${cap(k)}</span></label>`).join('')}</div>
    <input class="amt" name="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="₹0" value="${t.amount}" ${isNew?'autofocus':''}>
    <div class="grid2">
      <label class="f"><span id="accLbl">Account</span><select name="account">${acc(t.account)}</select></label>
      <label class="f" id="toWrap"><span>To</span><select name="to">${acc(t.to)}</select></label>
      <label class="f" id="catWrap"><span>Category</span><select name="category" id="catSel"></select></label>
    </div>
    <label class="f"><span>Date</span><input type="date" name="date" value="${t.date}" required></label>
    <label class="f"><span>Note</span><input name="note" value="${esc(t.note)}" placeholder="Optional" autocomplete="off"></label>
    ${actions(isNew)}</form>`,
  (fd, sub) => {
    if (sub && sub.value === 'del') { if (!confirm('Delete this entry?')) return false; D.transactions = D.transactions.filter(x => x.id !== t.id); toast('Deleted'); return; }
    const amount = parseFloat(fd.amount);
    if (!(amount > 0)) { toast('Enter an amount'); return false; }
    if (fd.type === 'transfer' && fd.account === fd.to) { toast('Pick two different accounts'); return false; }
    const rec = {type:fd.type, amount:Math.round(amount*100)/100, account:fd.account, to:fd.type==='transfer'?fd.to:'', category:fd.type==='transfer'?'':fd.category, date:fd.date||today(), note:(fd.note||'').trim()};
    if (isNew) D.transactions.push({id:uid_(), created:Date.now(), ...rec});
    else { const cur = live(D.transactions, t.id); if (!cur) { toast('That entry was deleted elsewhere'); return; } Object.assign(cur, rec); }
    toast(isNew ? 'Saved' : 'Updated');
  });
  const f = $('#sf');
  const sync = () => {
    const ty = f.elements.type.value;
    $('#toWrap').hidden = ty !== 'transfer'; $('#catWrap').hidden = ty === 'transfer';
    $('#accLbl').textContent = ty === 'transfer' ? 'From' : 'Account';
    const cats = [...D.categories[ty === 'income' ? 'income' : 'expense']];
    const cur = $('#catSel').value || t.category;
    if (cur && t.type === ty && !cats.includes(cur)) cats.push(cur);
    $('#catSel').innerHTML = cats.map(c => `<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  };
  f.addEventListener('change', e => { if (e.target.name === 'type') sync(); });
  sync();
}
function accountForm(a){
  const isNew = !a; const v = a || {name:'', type:'bank', opening:0};
  const types = ['cash','bank','card','wallet','investment'];
  openSheet(`<form id="sf">${head(isNew ? 'New account' : 'Edit account')}
    <label class="f"><span>Name</span><input name="name" value="${esc(v.name)}" placeholder="e.g. HDFC Savings" autocomplete="off" ${isNew?'autofocus':''}></label>
    <div class="grid2">
      <label class="f"><span>Type</span><select name="type">${types.map(x => `<option value="${x}" ${x===v.type?'selected':''}>${cap(x)}</option>`).join('')}</select></label>
      <label class="f"><span>Opening balance</span><input name="opening" type="number" inputmode="decimal" step="0.01" value="${v.opening}"></label>
    </div>
    <p class="hint">Balance = opening balance + every entry in this account. Use a negative opening balance for card dues.</p>
    ${actions(isNew)}</form>`,
  (fd, sub) => {
    if (sub && sub.value === 'del') {
      if (D.transactions.some(t => t.account === a.id || t.to === a.id)) { toast('This account has entries'); return false; }
      if (D.accounts.length <= 1) { toast('Keep at least one account'); return false; }
      if (!confirm(`Delete ${a.name}?`)) return false;
      D.accounts = D.accounts.filter(x => x.id !== a.id); return;
    }
    const name = (fd.name||'').trim(); if (!name) { toast('Give it a name'); return false; }
    const rec = {name, type:fd.type, opening:parseFloat(fd.opening) || 0};
    if (isNew) D.accounts.push({id:uid_(), ...rec}); else { const cur = live(D.accounts, a.id); if (cur) Object.assign(cur, rec); }
  });
}
function budgetForm(cat){
  openSheet(`<form id="sf">${head(esc(cat))}
    <label class="f"><span>Monthly limit</span><input name="limit" type="number" inputmode="decimal" min="0" step="1" value="${D.budgets[cat] || ''}" placeholder="₹0" autofocus></label>
    <p class="hint">Leave empty to remove the budget for this category.</p>
    ${actions(true)}</form>`,
  fd => { const v = parseFloat(fd.limit); if (v > 0) D.budgets[cat] = v; else delete D.budgets[cat]; toast('Budget saved'); });
}
function taskForm(x){
  const isNew = !x;
  const v = x || {title:'', project:S.proj !== 'all' ? S.proj : D.projects[0].id, due:S.taskFilter === 'all' ? '' : today(), time:'', priority:2, note:''};
  openSheet(`<form id="sf">${head(isNew ? 'New task' : 'Edit task')}
    <label class="f"><span>Task</span><input name="title" value="${esc(v.title)}" placeholder="What needs doing?" autocomplete="off" ${isNew?'autofocus':''}></label>
    <div class="seg">${[[1,'High'],[2,'Medium'],[3,'Low']].map(([p,l]) => `<label><input type="radio" name="priority" value="${p}" ${v.priority==p?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="grid2">
      <label class="f"><span>Due date</span><input type="date" name="due" value="${v.due||''}"></label>
      <label class="f"><span>Time</span><input type="time" name="time" value="${v.time||''}"></label>
    </div>
    <label class="f"><span>Project</span><select name="project">${D.projects.map(p => `<option value="${p.id}" ${p.id===v.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label class="f"><span>Notes</span><textarea name="note" placeholder="Optional">${esc(v.note)}</textarea></label>
    ${actions(isNew)}</form>`,
  (fd, sub) => {
    if (sub && sub.value === 'del') { if (!confirm('Delete this task?')) return false; D.tasks = D.tasks.filter(t => t.id !== x.id); toast('Deleted'); return; }
    const title = (fd.title||'').trim(); if (!title) { toast('Give the task a name'); return false; }
    const rec = {title, priority:+fd.priority || 2, due:fd.due || '', time:fd.due ? (fd.time || '') : '', project:fd.project, note:(fd.note||'').trim()};
    if (isNew) D.tasks.push({id:uid_(), done:false, doneAt:null, created:Date.now(), ...rec});
    else { const cur = live(D.tasks, x.id); if (!cur) { toast('That task was deleted elsewhere'); return; } Object.assign(cur, rec); }
    toast(isNew ? 'Task added' : 'Updated');
  });
}
function projectForm(p){
  const isNew = !p, canDel = !isNew && D.projects.length > 1;
  openSheet(`<form id="sf">${head(isNew ? 'New project' : 'Edit project')}
    <label class="f"><span>Name</span><input name="name" value="${esc(p?.name)}" placeholder="e.g. Home, Health, Side project" autocomplete="off" autofocus></label>
    ${canDel ? '<p class="hint">Deleting a project moves its tasks to another project.</p>' : ''}
    <div class="actions">${canDel ? '<button class="btn danger" value="del">Delete</button>' : ''}<button class="btn primary" value="save">Save</button></div></form>`,
  (fd, sub) => {
    if (sub && sub.value === 'del') {
      if (!confirm(`Delete "${p.name}"?`)) return false;
      const to = D.projects.find(q => q.id !== p.id).id;
      D.tasks.forEach(t => { if (t.project === p.id) t.project = to; });
      D.projects = D.projects.filter(q => q.id !== p.id); S.proj = 'all'; return;
    }
    const name = (fd.name||'').trim(); if (!name) { toast('Give it a name'); return false; }
    if (isNew) { const id = uid_(); D.projects.push({id, name}); S.proj = id; } else { const cur = live(D.projects, p.id); if (cur) cur.name = name; }
  });
}
function settingsForm(){
  openSheet(`<form id="sf">${head('Settings')}
    <div class="acctbox"><span class="label">Signed in as</span><b>${esc(user?.email)}</b>
      <div class="acctbtns"><button type="button" class="btn ghost small" data-act="pwreset">Change password</button><button type="button" class="btn danger small" data-act="signout">Sign out</button></div></div>
    <div class="setrow"><span>Theme</span><button type="button" class="btn ghost small" data-act="theme">${theme === 'dark' ? 'Switch to light' : 'Switch to dark'}</button></div>
    <label class="f"><span>Expense categories (comma separated)</span><textarea name="exp">${esc(D.categories.expense.join(', '))}</textarea></label>
    <label class="f"><span>Income categories (comma separated)</span><textarea name="inc">${esc(D.categories.income.join(', '))}</textarea></label>
    <div class="setrow"><span>Backup file</span><span style="display:flex;gap:8px"><button type="button" class="btn ghost small" data-act="export">Export</button><button type="button" class="btn ghost small" data-act="import">Restore</button></span></div>
    <p class="hint">Your data is private to your account and syncs to the cloud. It also works offline and syncs when you're back online.</p>
    ${actions(true)}</form>`,
  fd => {
    const parse = s => [...new Set((s||'').split(',').map(x => x.trim()).filter(Boolean))];
    const e = parse(fd.exp), i = parse(fd.inc);
    if (!e.length || !i.length) { toast('Keep at least one category'); return false; }
    D.categories.expense = e; D.categories.income = i; toast('Settings saved');
  });
}
function fab(){
  if (S.tab === 'money') return txnForm(null, 'expense');
  if (S.tab === 'tasks') return taskForm(null);
  openSheet(`${head('Add')}<div class="quick">
    <button data-act="quick" data-v="expense"><span class="e">↗</span>Expense<small>Money out</small></button>
    <button data-act="quick" data-v="income"><span class="e">↙</span>Income<small>Money in</small></button>
    <button data-act="quick" data-v="task"><span class="e">✓</span>Task<small>To-do for a day</small></button>
    <button data-act="quick" data-v="journal"><span class="e">✎</span>Journal<small>Today's entry</small></button></div>`, null);
}

/* ---------- backup ---------- */
function exportData(){
  D.lastBackup = Date.now(); save();
  const blob = new Blob([JSON.stringify(D, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dark-satin-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Backup downloaded');
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    if (!obj || !Array.isArray(obj.transactions) || !Array.isArray(obj.accounts)) throw new Error('bad');
    if (!confirm('Replace everything in your account with this backup?')) return;
    D = migrate(obj); save(); closeSheet(); render(); toast('Backup restored');
  } catch (_) { toast("That file isn't a DARK-SATIN backup"); }
});

/* ---------- theme ---------- */
const THEME_KEY = 'daybook.theme';
let theme = null; try { theme = localStorage.getItem(THEME_KEY); } catch (_) {}
theme = theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function applyTheme(){ document.documentElement.dataset.theme = theme; $('meta[name=theme-color]').content = theme === 'light' ? '#f4f2ec' : '#0e1013'; }
function toggleTheme(){ theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); try { localStorage.setItem(THEME_KEY, theme); } catch (_) {} }
applyTheme();

/* ---------- one click handler for everything ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    // login screens
    case 'gview': gate(el.dataset.v); break;
    case 'pwshow': { const inp = el.previousElementSibling; const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show'; break; }
    case 'resend': try { await sendEmailVerification(auth.currentUser); $('#gerr').textContent = 'Sent again. Check your inbox and spam folder.'; } catch (ex) { $('#gerr').textContent = authMsg(ex); } break;
    case 'verified': {
      const u = auth.currentUser; if (!u) break;
      await u.reload();
      if (u.emailVerified) { await u.getIdToken(true); startUser(u); }   // fresh token so the rules see the verified email
      else $('#gerr').textContent = "Not verified yet. Tap the link in the email first.";
      break;
    }
    case 'signout': doSignOut(ready); break;
    case 'pwreset': try { await sendPasswordResetEmail(auth, user.email); toast('Password reset link sent to your email'); } catch (ex) { toast(authMsg(ex)); } break;
    // app
    case 'tab': flushJournal(); S.tab = el.dataset.tab; render(); scrollTo(0,0); break;
    case 'gobudgets': S.tab = 'money'; S.moneyView = 'budgets'; S.ym = monthOf(today()); render(); scrollTo(0,0); break;
    case 'month': S.ym = addMonths(S.ym, +el.dataset.n); render(); break;
    case 'mview': S.moneyView = el.dataset.v; render(); break;
    case 'editTxn': txnForm(live(D.transactions, id)); break;
    case 'newAccount': accountForm(null); break;
    case 'editAccount': accountForm(live(D.accounts, id)); break;
    case 'editBudget': budgetForm(el.dataset.cat); break;
    case 'toggleTask': { const t = live(D.tasks, id); if (!t) break; t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(); render(); if (t.done) toast('Done ✓'); break; }
    case 'editTask': taskForm(live(D.tasks, id)); break;
    case 'tfilter': S.taskFilter = el.dataset.v; render(); break;
    case 'proj': S.proj = el.dataset.v; render(); break;
    case 'newProject': projectForm(null); break;
    case 'editProject': projectForm(live(D.projects, id)); break;
    case 'jday': flushJournal(); S.jDate = addDays(S.jDate, +el.dataset.n); render(); break;
    case 'jopen': flushJournal(); S.tab = 'journal'; S.jDate = el.dataset.d; render(); scrollTo(0,0); break;
    case 'mood': { flushJournal(); const en = jEntry(S.jDate, true), v = +el.dataset.v; en.mood = en.mood === v ? 0 : v; en.updated = Date.now(); cleanEntry(S.jDate); save(); render(); break; }
    case 'planToTasks': planToTasks(); break;
    case 'fab': fab(); break;
    case 'quick': { const v = el.dataset.v; if (v === 'task') taskForm(null); else if (v === 'journal') { closeSheet(); S.tab = 'journal'; S.jDate = today(); render(); } else txnForm(null, v); break; }
    case 'settings': settingsForm(); break;
    case 'closeSheet': closeSheet(); break;
    case 'theme': toggleTheme(); el.textContent = theme === 'dark' ? 'Switch to light' : 'Switch to dark'; break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) flushJournal(); });
addEventListener('pagehide', flushJournal);

/* ---------- start ---------- */
if (!configured) gate('setup');
else {
  gate('loading');
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}), ignoreUndefinedProperties: true});
  onAuthStateChanged(auth, u => {
    if (!u) { if (user) location.reload(); else gate('signin'); return; }
    if (!u.emailVerified) { gate('verify', {email: u.email}); return; }
    startUser(u);
  });
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes">
<title>DARK-SATIN</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="logo-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="logo-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c-in:#2f97c8;--c-out:#cf7a30;--bg:#0e1013;--s1:#16191e;--s2:#1e2229;--line:#292e37;--tx:#eceef1;--mu:#8a919d;--ac:#8fd1b0;--ac-ink:#0e1013;--pos:#6fd6a0;--neg:#ff8577;--warn:#f0b75e;--r:18px;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--c-in:#0f7fa8;--c-out:#d9782a;--bg:#f4f2ec;--s1:#fff;--s2:#ece8de;--line:#e2ddd2;--tx:#1b1d20;--mu:#6d7179;--ac:#2f7d5b;--ac-ink:#fff;--pos:#1f8a55;--neg:#c9443a;--warn:#b7791f;--shadow:0 10px 30px rgba(40,30,10,.14)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'Manrope',system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(var(--bg) 75%,transparent);max-width:560px;margin:0 auto}
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:10px}
.brand img{border-radius:9px}
.brand i{color:var(--ac);font-style:normal}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.icon-btn svg{width:20px;height:20px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(130px + env(safe-area-inset-bottom))}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.15}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.muted{color:var(--mu)}
.hello{margin:6px 2px 16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.link{color:var(--ac);font-weight:600;font-size:13px}
.hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--ac) 20%,var(--s1)) 0%,var(--s1) 60%)}
.label{font-size:12px;color:var(--mu);display:block}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 b{font-size:17px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{color:var(--mu);font-size:14px}
p.empty.card{padding:18px 16px}
.jsnip{font-family:'Fraunces',serif;font-size:15px;line-height:1.55;color:var(--tx);opacity:.85}
.nudge{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));display:flex;align-items:center;gap:12px}
.nudge p{flex:1;font-size:13px;color:var(--mu)}
.nudge b{color:var(--tx);display:block}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card>.task:first-child,.card-h+.task,.dgroup+.task{border-top:0}
.chk{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ac-ink)}
.task.done .chk{background:var(--ac);border-color:var(--ac)}
.task.done .ttl{text-decoration:line-through;color:var(--mu)}
.tmain{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:600;word-break:break-word}
.meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.meta:empty{display:none}
.due-over{color:var(--neg);font-weight:600}.due-today{color:var(--ac);font-weight:600}
.pri{width:8px;height:8px;border-radius:50%;flex:none}
.p1{background:var(--neg)}.p2{background:var(--warn)}.p3{background:var(--line)}
.more{font-size:13px;color:var(--mu);padding-top:8px}
/* nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu)}
.tabs svg{width:22px;height:22px}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{color:var(--ac)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:20px;background:var(--ac);color:var(--ac-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
/* segments & chips */
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg>*{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span,.seg>button{display:block;text-align:center;padding:8px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mu);width:100%;cursor:pointer}
.seg input:checked+span,.seg>button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg em{font-style:normal;opacity:.6;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.dash{border-style:dashed;color:var(--mu)}
.acct{flex:none;min-width:132px;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left}
.acct small{display:block;color:var(--mu);font-size:12px}
.acct b{font-variant-numeric:tabular-nums}
.acct.add{display:grid;place-items:center;min-width:64px;color:var(--mu);font-size:22px;border-style:dashed}
/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.datebar>button{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:20px}
.datebar>div{text-align:center}
.datebar b{display:block;font-size:17px}
.datebar small{color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum>div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.sum b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
/* transactions */
.dgroup{font-size:12px;font-weight:700;color:var(--mu);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.card .dgroup{margin:14px 0 2px}
.card .dgroup:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.tx .ic{width:36px;height:36px;border-radius:11px;background:var(--s2);display:grid;place-items:center;font-weight:700;flex:none;color:var(--mu)}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600}
.tx .m small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
/* budgets */
.brow{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.brow:first-child,.card-h+.brow{border-top:0}
.bt{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;gap:8px}
.bt small{color:var(--mu);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--neg)}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
/* journal */
.moods{display:flex;gap:6px;margin-bottom:12px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:14px;background:var(--s1);border:1px solid var(--line);filter:grayscale(1);opacity:.5;transition:.15s}
.mood.on{filter:none;opacity:1;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--s1))}
.jlabel{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
textarea.jt{display:block;width:100%;min-height:220px;field-sizing:content;resize:none;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-family:'Fraunces',serif;font-size:17px;line-height:1.6;outline:none}
textarea.jp{min-height:110px;font-family:'Manrope',sans-serif;font-size:15px;line-height:1.7}
textarea.jt:focus{border-color:var(--ac)}
.saved{font-size:12px;color:var(--mu)}
.jentry{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.jentry b{font-size:14px}
.jentry p{color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
/* sheet & forms */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:10px;background:var(--s1);font-size:15px;color:var(--mu)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--mu)}
.f input,.f select,.f textarea{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;min-height:48px}
.f textarea{min-height:72px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.amt{width:100%;font-size:38px;font-weight:700;text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 0 10px;margin-bottom:16px;outline:none;font-variant-numeric:tabular-nums}
.amt:focus{border-color:var(--ac)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;text-align:center}
.btn.primary{background:var(--ac);color:var(--ac-ink)}
.btn.danger{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg);flex:.6}
.btn.ghost{background:var(--s1);border:1px solid var(--line)}
.btn.small{flex:none;padding:10px 14px;font-size:13px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{padding:18px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left;font-weight:700}
.quick small{display:block;color:var(--mu);font-weight:500;font-size:12px;margin-top:2px}
.quick .e{font-size:22px;display:block;margin-bottom:6px;color:var(--ac)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.setrow>span{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* login */
body.pre .top,body.pre main,body.pre .fab,body.pre .tabs{display:none!important}
.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
body.pre .gate{display:flex}
.gate-in{width:100%;max-width:380px}
.glogo{width:76px;height:76px;border-radius:22px;display:block;margin:0 auto 16px;box-shadow:var(--shadow)}
.gname{text-align:center;font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.gname i{color:var(--ac);font-style:normal}
.gsub{text-align:center;color:var(--mu);font-size:14px;margin-bottom:22px;line-height:1.6}
.gsub b{color:var(--tx)}
.gok{background:color-mix(in srgb,var(--ac) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.gerr{color:var(--neg);font-size:13px;min-height:18px;margin:2px 2px 10px}
.glinks{display:flex;justify-content:space-between;margin-top:16px}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--mu);padding:8px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;margin:8px auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.acctbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.acctbox b{display:block;word-break:break-all;margin:2px 0 10px}
.acctbtns{display:flex;gap:8px}
.btn.danger.small{flex:none}
/* v2: lock, quick, recurring */
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast button{color:var(--ac);font-weight:800;padding:2px 0}
[data-theme=light] .toast button{color:#8fd1b0}
.rp{color:var(--ac);font-weight:700}
.qbar{margin-bottom:14px}
.qbar .label{margin:0 2px 8px}
.qbar .chips{margin-bottom:0}
.check{display:flex;align-items:center;gap:10px;margin:2px 2px 14px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--ac)}
.qlist{display:flex;flex-wrap:wrap;gap:8px}
.qlist .chip{display:flex;align-items:center;gap:6px;padding-right:6px}
.qlist .chip button{width:24px;height:24px;border-radius:50%;background:var(--s2);color:var(--mu);font-size:15px;line-height:1}
select.mini{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lockscr{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.lockscr.on{display:flex}
.lock-in{width:100%;max-width:320px;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:4px 0 8px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}
.dots i.on{background:var(--ac);border-color:var(--ac)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 6px 22px}
.keys button{height:66px;border-radius:50%;width:66px;justify-self:center;background:var(--s1);border:1px solid var(--line);font-size:24px;font-weight:600}
.keys button:active{background:var(--s2)}
.keys .kb{background:none;border:0;color:var(--ac);display:grid;place-items:center}
.keys .kb svg{width:30px;height:30px}
.keys .kd{background:none;border:0;color:var(--mu);font-size:22px}
/* v3: reports & allocation */
.seg>button{padding-left:2px;padding-right:2px}
.bar.done i{background:var(--ac)}
.brow.alloc .bt small{margin-left:4px}
.crow{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.card-h+.crow{border-top:0}
.cbar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--c-out);border-radius:0 4px 4px 0}
.cmeta{display:flex;gap:10px;font-size:12px;margin-top:5px;min-height:16px}
.cmeta .up{color:var(--tx);font-weight:600}.cmeta .down{color:var(--mu);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:-2px 0 6px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw-in{background:var(--c-in)}.sw-out{background:var(--c-out)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .b-in{fill:var(--c-in)}.chart .b-out{fill:var(--c-out)}
.chart .dim{opacity:.45}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mu);font-size:10px;font-family:inherit}
.chart .axsel{fill:var(--tx);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.mini-t{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
.mini-t tr{cursor:pointer;display:grid;grid-template-columns:40px 1fr 1fr 56px;gap:6px;padding:5px 2px;border-top:1px solid var(--line)}
.mini-t td{text-align:right;color:var(--mu)}.mini-t td:first-child{text-align:left}
.mini-t tr.on td{color:var(--tx);font-weight:700}
.mini-t tr.th{border-top:0;cursor:default}.mini-t tr.th td{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.mini-t td.neg{color:var(--neg)}
.bucket{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.bhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bname{flex:1;min-width:0;background:var(--s2);border:1px solid transparent;border-radius:10px;padding:10px;font-weight:700;outline:none}
.bname:focus,.pctbox:focus-within{border-color:var(--ac)}
.pctbox{display:flex;align-items:center;gap:2px;background:var(--s2);border:1px solid transparent;border-radius:10px;padding:0 10px 0 4px;font-weight:700;color:var(--mu)}
.pctbox input{width:46px;background:none;border:0;padding:10px 2px;text-align:right;font-weight:700;color:var(--tx);outline:none}
.seg.sm{margin-bottom:10px}.seg.sm>button{padding:6px 4px;font-size:12px}
.bucket .label{margin:0 2px 6px}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset .chip{padding:6px 11px;font-size:12px}
.chip.taken{opacity:.4}
.alloc-total{text-align:center;font-size:13px;color:var(--mu);margin-bottom:6px}
.alloc-total.ok b{color:var(--ac)}.alloc-total.bad,.alloc-total.bad b{color:var(--neg)}
.meta .bell{color:var(--ac);font-weight:600}
/* v5: trading, search, insights, encryption, import */
.hbtns{display:flex;gap:8px}
.tabs button{max-width:112px}
.sum.s6{grid-template-columns:repeat(3,1fr)}
.sum.s6 b small{font-weight:500;color:var(--mu);font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding-bottom:2px}

function balances(){
  const b = {}; D.accounts.forEach(a => b[a.id] = +a.opening || 0);

    const a = +t.amount || 0;
    if (t.type === 'income') b[t.account] = (b[t.account]||0) + a;
    else if (t.type === 'expense') b[t.account] = (b[t.account]||0) - a;
    else if (t.type === 'transfer') { b[t.account] = (b[t.account]||0) - a; b[t.to] = (b[t.to]||0) + a; }

/* ---------- REPORTS & ALLOCATION ---------- */
const pct = x => (x === 0 ? '0' : (x * 100).toFixed(Math.abs(x) < 0.1 ? 1 : 0)) + '%';
const shortMoney = n => { const a = Math.abs(n); return (n < 0 ? '−' : '') + '₹' + (a >= 1e7 ? (a/1e7).toFixed(1).replace(/\.0$/,'') + 'Cr' : a >= 1e5 ? (a/1e5).toFixed(1).replace(/\.0$/,'') + 'L' : a >= 1e3 ? (a/1e3).toFixed(1).replace(/\.0$/,'') + 'k' : Math.round(a)); };
const shortMonth = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'short'}); };

// How much went into each bucket this month: expenses by category, plus money moved (transferred) into its accounts.
function allocActuals(ym){
  const A = D.alloc, by = {}, cat = {}, acc = {};
  A.buckets.forEach(b => { by[b.id] = 0; if (b.kind === 'save') (b.accts||[]).forEach(x => acc[x] = b.id); else (b.cats||[]).forEach(c => cat[c] = b.id); });
  let other = 0;
  D.transactions.forEach(t => {
    if (monthOf(t.date) !== ym) return;
    const a = +t.amount || 0;
    if (t.type === 'expense') { const o = cat[t.category]; if (o) by[o] += a; else other += a; }
    else if (t.type === 'transfer') {
      const into = acc[t.to], outOf = acc[t.account];
      if (into && into !== outOf) by[into] += a;          // e.g. Bank → Zerodha counts for Trading
      if (outOf && outOf !== into) by[outOf] -= a;        // taking money back out reduces it
    }
  });
  return {by, other};
}
function allocBase(ym){ return D.alloc.base === 'fixed' ? (+D.alloc.fixed || 0) : monthTotals(ym).inc; }
function allocRows(ym, compact){
  const base = allocBase(ym), {by, other} = allocActuals(ym);
  let h = D.alloc.buckets.map(b => {
    const plan = base * (+b.pct || 0) / 100, act = by[b.id] || 0, p = plan > 0 ? act / plan : (act > 0 ? 1 : 0);
    const save = b.kind === 'save';
    const cls = save ? (p >= 1 ? 'done' : '') : (act > plan ? 'over' : p > .85 ? 'warn' : '');
    const note = save
      ? (plan <= 0 ? '' : act >= plan ? 'Target reached' : `${money(plan - act)} to go`)
      : (plan <= 0 ? '' : act > plan ? `${money(act - plan)} over` : `${money(plan - act)} left`);
    return `<div class="brow alloc" data-act="${compact ? 'goreports' : 'editAlloc'}"><div class="bt"><span>${esc(b.name)} <small>${+b.pct || 0}%</small></span><span class="${!save && act > plan ? 'neg' : ''}">${money(act)} <small>/ ${money(plan)}</small></span></div>
      <div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(p, 1)) * 100}%"></i></div>${compact ? '' : `<p class="hint">${save ? 'Saved' : 'Spent'} ${plan > 0 ? pct(Math.max(act, 0) / plan) + ' of plan' : ''}${note ? ' · ' + note : ''}</p>`}</div>`;
  }).join('');
  if (!compact && other > 0) h += `<p class="hint" style="padding-top:8px;border-top:1px solid var(--line)">${money(other)} spent in categories not in any bucket. <button class="link" data-act="editAlloc">Edit plan</button></p>`;
  return h;
}
function trendChart(endYm){
  const months = Array.from({length:6}, (_, i) => addMonths(endYm, i - 5)), data = months.map(m => ({m, ...monthTotals(m)}));
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const step = (() => { const raw = max / 3, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag; })();
  const top = step * Math.ceil(max / step);
  const W = 340, H = 168, L = 40, B = 22, T = 8, cw = (W - L) / 6, bw = Math.min(16, cw / 2 - 6), ph = H - B - T;
  const y = v => T + ph - v / top * ph;
  const bar = (x, v, cls) => { const h = v / top * ph; if (h < 0.5) return ''; const r = Math.min(4, h, bw / 2), yy = T + ph - h;
    return `<path class="${cls}" d="M${x},${T+ph} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ph} Z"/>`; };
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v ? shortMoney(v) : '0'}</text>`;
  data.forEach((d, i) => {
    const cx = L + cw * i + cw / 2, sel = d.m === endYm;
    g += `<g class="${sel ? 'sel' : 'dim'}">${bar(cx - bw - 1, d.inc, 'b-in')}${bar(cx + 1, d.exp, 'b-out')}</g>`;
    g += `<text class="ax ${sel ? 'axsel' : ''}" x="${cx}" y="${H - 6}" text-anchor="middle">${shortMonth(d.m)}</text>`;
    g += `<rect class="hit" x="${L + cw * i}" y="0" width="${cw}" height="${H}" data-act="pickMonth" data-m="${d.m}"><title>${monthName(d.m)}: in ${money(d.inc)}, out ${money(d.exp)}</title></rect>`;
  });
  return `<div class="legend"><span><i class="sw sw-in"></i>Income</span><span><i class="sw sw-out"></i>Spending</span><span class="muted" style="margin-left:auto">Tap a month</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending, last 6 months">${g}</svg>
    <table class="mini-t"><tr class="th"><td></td><td>In</td><td>Out</td><td>Saved</td></tr>${data.slice().reverse().map(d => `<tr class="${d.m === endYm ? 'on' : ''}" data-act="pickMonth" data-m="${d.m}"><td>${shortMonth(d.m)}</td><td>${money(d.inc)}</td><td>${money(d.exp)}</td><td class="${d.inc - d.exp < 0 ? 'neg' : ''}">${d.inc ? pct((d.inc - d.exp) / d.inc) : '—'}</td></tr>`).join('')}</table>`;
}

/* ---------- TRADING ---------- */
// P&L of one entry. A "Day P&L" entry is just the number; a trade is (exit − entry) × qty, flipped for shorts, minus charges.
function tradePnl(t){
  if (t.mode === 'pnl') return +t.pnl || 0;
  if (t.exit === '' || t.exit === null || t.exit === undefined || isNaN(+t.exit)) return null;      // still open
  return Math.round(((+t.exit - +t.entry) * (+t.qty || 0) * (t.side === 'short' ? -1 : 1) - (+t.charges || 0)) * 100) / 100;
}
const pnlDate = t => (t.kind === 'swing' && t.exitDate) || t.date;          // swing P&L counts on the day you exit
const signMoney = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const signShort = n => (n > 0 ? '+' : n < 0 ? '−' : '') + shortMoney(Math.abs(n)).replace('−', '');
function tradeStats(filter){
  const days = {}, wins = [], losses = [];
  for (const t of D.trades) {
    const p = tradePnl(t); if (p === null) continue;
    const d = pnlDate(t); if (filter && !filter(d)) continue;
    (days[d] ||= {pnl:0, n:0}).pnl += p; days[d].n++;
    if (t.mode !== 'pnl') (p > 0 ? wins : p < 0 ? losses : []).push(p);
  }
  const dv = Object.entries(days), net = dv.reduce((s, [, v]) => s + v.pnl, 0);
  const sw = wins.reduce((a, b) => a + b, 0), sl = losses.reduce((a, b) => a + b, 0);
  const best = dv.reduce((b, x) => !b || x[1].pnl > b[1].pnl ? x : b, null), worst = dv.reduce((b, x) => !b || x[1].pnl < b[1].pnl ? x : b, null);
  return {days, net, trades: wins.length + losses.length, wins: wins.length, losses: losses.length,
    winRate: wins.length + losses.length ? wins.length / (wins.length + losses.length) : null,
    avgWin: wins.length ? sw / wins.length : null, avgLoss: losses.length ? sl / losses.length : null,
    pf: sl ? sw / Math.abs(sl) : null, green: dv.filter(([, v]) => v.pnl > 0).length, red: dv.filter(([, v]) => v.pnl < 0).length,
    best: best && best[1].pnl > 0 ? best : null, worst: worst && worst[1].pnl < 0 ? worst : null};
}
function tradeTitle(t){ return t.mode === 'pnl' ? 'Day P&L' : `${t.symbol || 'Trade'}`; }
function tradeSub(t){
  if (t.mode === 'pnl') return t.note || '';
  const bits = [t.kind === 'swing' ? 'Swing' : 'Intraday', t.side === 'short' ? 'Short' : 'Long', `${+t.qty || 0} × ${money(+t.entry || 0)}${tradePnl(t) === null ? '' : ' → ' + money(+t.exit)}`];
  return bits.join(' · ') + (t.note ? ' · ' + t.note : '');
}
function tradeRow(t){
  const p = tradePnl(t);
  return `<button class="tx" data-act="editTrade" data-id="${t.id}"><span class="ic">${t.mode === 'pnl' ? '₹' : esc((t.symbol || '?').slice(0, 2))}</span><span class="m"><b>${esc(tradeTitle(t))}</b><small>${esc(tradeSub(t))}</small></span><span class="a ${p > 0 ? 'pos' : p < 0 ? 'neg' : 'muted'}">${p === null ? 'Open' : signMoney(p)}</span></button>`;
}
// Mood (from the journal) against that day's P&L, all time.
function moodVsPnl(){
  const st = tradeStats(), rows = [1, 2, 3, 4, 5].map(m => ({m, days:0, pnl:0, green:0}));
  for (const [d, v] of Object.entries(st.days)) { const j = D.journal[d]; if (!j || j.locked || !j.mood) continue; const r = rows[j.mood - 1]; r.days++; r.pnl += v.pnl; if (v.pnl > 0) r.green++; }
  return rows.filter(r => r.days).map(r => ({...r, avg: r.pnl / r.days}));
}

// Keep one Money entry per trading day ("trd_<date>") equal to that day's net P&L, when turned on.
function syncTradingToMoney(){
  const tr = D.trading || {}, on = tr.post && D.accounts.some(a => a.id === tr.account);
  const want = new Map();
  if (on) {
    for (const [d, v] of Object.entries(tradeStats().days)) {
      const p = Math.round(v.pnl * 100) / 100; if (!p) continue;
      want.set('trd_' + d, {type: p > 0 ? 'income' : 'expense', amount: Math.abs(p), account: tr.account, to:'', category: p > 0 ? 'Trading' : 'Trading loss', note:'Trading P&L', date:d, auto:'trading'});
    }
    if (!D.categories.income.includes('Trading')) D.categories.income.push('Trading');
    if (!D.categories.expense.includes('Trading loss')) D.categories.expense.push('Trading loss');
  }
  D.transactions = D.transactions.filter(x => x.auto !== 'trading' || want.has(x.id));
  for (const [id, rec] of want) {
    const cur = D.transactions.find(x => x.id === id);
    if (!cur) D.transactions.push({id, created:Date.now(), ...rec});
    else if (stable({...cur, created:0}) !== stable({...rec, id, created:0})) Object.assign(cur, rec);
  }
}

function hl(text, q){
  const s = String(text || ''), i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s.slice(0, 90));
  const from = Math.max(0, i - 30), part = s.slice(from, i + q.length + 60);
  return (from ? '…' : '') + esc(part).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'ig'), m => `<mark>${m}</mark>`);
}
function runSearch(){
  const q = ($('#q')?.value || '').trim().toLowerCase(), out = $('#qres'); if (!out) return;
  if (q.length < 2) { out.innerHTML = '<p class="hint" style="margin:10px 2px">Type at least 2 letters.</p>'; return; }

function journalStreak(){
  const has = d => { const e = D.journal[d]; return e && (e.locked || (e.text || '').trim() || e.mood); };
  let d = today(); if (!has(d)) d = addDays(d, -1);
  let n = 0; while (has(d) && n < 3650) { n++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  Object.keys(D.journal).filter(has).sort().forEach(k => { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; });
  return {n, best, wroteToday: !!has(today())};
}

let imp = null;
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/).slice(0, 15).join('\n');
  const delim = [',', ';', '\t', '|'].map(d => [d, (first.match(new RegExp(d === '|' ? '\\|' : d, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
}
const MONTHS = {jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, sept:9, oct:10, nov:11, dec:12};
function parseDateIN(s){
  s = String(s || '').trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?(\s*[ap]m)?$/i, '');
  let m;
  if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s))) return mk(+m[1], +m[2], +m[3]);
  if ((m = /^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})$/.exec(s))) return mk(yr(m[3]), +m[2], +m[1]);           // Indian banks: day first
  if ((m = /^(\d{1,2})[-/ ]([A-Za-z]{3,4})[a-z]*[-/ ,]*(\d{2,4})$/.exec(s))) return mk(yr(m[3]), MONTHS[m[2].toLowerCase()], +m[1]);
  return null;
  function yr(y){ y = +y; return y < 100 ? 2000 + y : y; }
  function mk(y, mo, d){ if (!mo || mo > 12 || d < 1 || d > 31) return null; const dt = new Date(y, mo - 1, d); return dt.getMonth() === mo - 1 ? ds(dt) : null; }
}
const numIN = s => { const t = String(s || '').replace(/[₹,\s]|INR|Rs\.?/gi, ''); if (!t || t === '-') return 0; const neg = /^\(.*\)$/.test(t) || /^-/.test(t); const v = parseFloat(t.replace(/[()\-]/g, '')); return isNaN(v) ? 0 : (neg ? -v : v); };
function detectColumns(rows){
  let hi = -1, best = 0;
  rows.slice(0, 40).forEach((r, i) => { const t = r.join(' ').toLowerCase(); const sc = /date/.test(t) + /narration|description|particular|remark|details|transaction/.test(t) + /withdrawal|debit|dr\b|amount/.test(t) + /deposit|credit|cr\b/.test(t) + /balance/.test(t); if (sc > best) { best = sc; hi = i; } });
  if (best < 2) hi = -1;
  const hdr = hi >= 0 ? rows[hi].map(x => x.toLowerCase()) : [];
  const find = re => hdr.findIndex(x => re.test(x));
  const map = {date: find(/^(txn |transaction |value )?date|date$/), desc: find(/narration|description|particular|remark|details/), debit: find(/withdrawal|debit|^dr$|paid out/), credit: find(/deposit|credit|^cr$|paid in/), amount: -1, drcr: find(/dr\s*\/\s*cr|cr\s*\/\s*dr|^type$/)};
  if (map.debit < 0 && map.credit < 0) map.amount = find(/amount/);
  if (map.date < 0) map.date = find(/date/);

}
const RULES = [[/swiggy|zomato|restaurant|cafe|hotel|dominos|pizza|kfc|mcdonald|starbucks|food/i, 'Food'], [/bigbasket|blinkit|zepto|grofers|dmart|grocery|kirana|instamart|jiomart/i, 'Groceries'],
  [/uber|ola|rapido|petrol|fuel|hpcl|bpcl|iocl|indian oil|metro|irctc|fastag|parking|redbus/i, 'Transport'], [/amazon|flipkart|myntra|ajio|meesho|nykaa|croma|reliance digital/i, 'Shopping'],
  [/electric|bescom|msedcl|tata power|airtel|jio|vodafone|vi |bsnl|recharge|broadband|gas|water|bill|dth|tata play/i, 'Bills'], [/rent/i, 'Rent'],
  [/hospital|pharma|apollo|medplus|1mg|clinic|doctor|netmeds/i, 'Health'], [/netflix|hotstar|spotify|prime video|bookmyshow|pvr|inox|youtube/i, 'Fun'],
  [/salary|sal cr|payroll/i, 'Salary', 'income'], [/interest|int\.?pd|int cr/i, 'Interest', 'income'], [/zerodha|groww|upstox|angel|dhan|fyers|5paisa/i, 'Trading', 'income']];
function guessCategory(desc, type){
  const d = desc.toLowerCase(), cats = D.categories[type === 'income' ? 'income' : 'expense'];
  for (const [k, c] of Object.entries(D.importRules || {})) if (d.includes(k) && cats.includes(c)) return c;
  for (const [re, c, ty] of RULES) if (re.test(desc) && (ty || 'expense') === type && cats.includes(c)) return c;
  return cats.includes('Other') ? 'Other' : cats[cats.length - 1];

const ruleKey = desc => (desc.toLowerCase().replace(/upi[\/-]|neft[\/-]|imps[\/-]|pos |ach |nach |[0-9]{4,}|[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 3)[0]) || '';

function importParse(text, account){
  const rows = parseCSV(text);
  if (rows.length < 2) { toast("That file doesn't look like a statement"); return; }
  const {hi, map} = detectColumns(rows);
  imp = {rows, hi, map, account, items: []};
  buildImportItems(); drawImport();
}
function buildImportItems(){
  const {rows, hi, map, account} = imp, out = [];
  const existing = new Set(D.transactions.filter(t => t.account === account).map(t => `${t.date}|${t.type}|${(+t.amount).toFixed(2)}`));
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i], date = parseDateIN(r[map.date]); if (!date) continue;
    let amt = 0;
    if (map.amount >= 0) { amt = numIN(r[map.amount]); if (map.drcr >= 0 && /^d/i.test(r[map.drcr] || '')) amt = -Math.abs(amt); else if (map.drcr >= 0 && /^c/i.test(r[map.drcr] || '')) amt = Math.abs(amt); }
    else amt = Math.abs(numIN(r[map.credit])) - Math.abs(numIN(r[map.debit]));
    if (!amt) continue;
    const desc = (map.desc >= 0 ? r[map.desc] : '').replace(/\s+/g, ' ').trim(), type = amt > 0 ? 'income' : 'expense', amount = Math.round(Math.abs(amt) * 100) / 100;
    const id = 'imp_' + hashStr(`${account}|${date}|${amount}|${desc}|${i}`);
    const already = D.transactions.some(t => t.id === id), dup = already || existing.has(`${date}|${type}|${amount.toFixed(2)}`);
    out.push({id, date, desc, type, amount, category: guessCategory(desc, type), on: !dup, dup, already});
  }

}

/* ---------- WEALTH: income statement & balance sheet ---------- */
const INCOME_TYPES = {earned:'Earned', passive:'Passive', portfolio:'Portfolio', other:'Other'};
function incomeType(cat){
  if (D.incomeTypes && D.incomeTypes[cat]) return D.incomeTypes[cat];
  if (/salary|business|freelanc|bonus|wage|consult|commission/i.test(cat)) return 'earned';
  if (/interest|dividend|rent|royalt|passive/i.test(cat)) return 'passive';
  if (/trading|capital gain|profit/i.test(cat)) return 'portfolio';
  return 'other';
}
const holdingValue = h => (+h.qty || 0) * (h.price ? +h.price : +h.avg || 0);
const holdingCost = h => (+h.qty || 0) * (+h.avg || 0);
// A loan's balance = what you said you owed, minus the principal part of every EMI recorded after that.
function loanBalance(l){
  const paid = D.transactions.filter(t => t.loan === l.id && (+t.created || 0) > (+l.startAt || 0)).reduce((s, t) => s + (+t.principal || 0), 0);
  return Math.max(0, Math.round(((+l.startBalance || 0) - paid) * 100) / 100);
}
function balanceSheet(){
  const bal = balances(), cash = [], broker = [], dues = [];
  for (const a of D.accounts) {
    const v = Math.round((bal[a.id] || 0) * 100) / 100;
    if (a.type === 'investment') broker.push({id:a.id, name:a.name, v});
    else if (v < 0) dues.push({id:a.id, name:a.name + (a.type === 'card' ? ' (card dues)' : ' (overdrawn)'), v:-v});
    else cash.push({id:a.id, name:a.name, v});
  }
  const hold = (D.holdings || []).filter(h => +h.qty > 0).map(h => ({h, v:holdingValue(h), c:holdingCost(h)}));
  const others = (D.others || []).map(o => ({o, v:+o.value || 0}));
  const loans = (D.loans || []).map(l => ({l, v:loanBalance(l)}));
  const sum = xs => xs.reduce((s, x) => s + x.v, 0);
  const A = {cash:sum(cash), broker:sum(broker), hold:sum(hold), others:sum(others)}, L = {loans:sum(loans), dues:sum(dues)};
  const assets = A.cash + A.broker + A.hold + A.others, liab = L.loans + L.dues;
  return {cash, broker, hold, others, loans, dues, A, L, assets, liab, net: assets - liab, invested: hold.reduce((s, x) => s + x.c, 0)};
}
function snapshotNetWorth(){

  if (!cur || cur.a !== v.a || cur.l !== v.l) { D.nwHistory = {...(D.nwHistory || {}), [k]: v}; return true; }
  return false;
}
function incomeStatement(ym){
  const inc = {earned:{}, passive:{}, portfolio:{}, other:{}}, exp = {};
  let doodads = 0, emi = 0;
  for (const t of D.transactions) {
    if (monthOf(t.date) !== ym) continue;
    const a = +t.amount || 0;
    if (t.type === 'income') { const ty = incomeType(t.category); inc[ty][t.category] = (inc[ty][t.category] || 0) + a; }
    else if (t.type === 'expense') {
      if (t.category === 'Trading loss') { inc.portfolio['Trading'] = (inc.portfolio['Trading'] || 0) - a; continue; }   // losses reduce trading income
      exp[t.category] = (exp[t.category] || 0) + a;
      if (t.doodad) doodads += a;
      if (t.loan || t.category === 'EMI') emi += a;
    }
  }
  const tot = o => Object.values(o).reduce((s, v) => s + v, 0);
  const T = {earned:tot(inc.earned), passive:tot(inc.passive), portfolio:tot(inc.portfolio), other:tot(inc.other)};
  const income = T.earned + T.passive + T.portfolio + T.other, expenses = tot(exp);

}

\n    .setMimeType(ContentService.MimeType.JSON);\n}\n\n// NSE:RELIANCE -> RELIANCE.NS   BSE:500325 -> 500325.BO\nfunction yahooSymbol(s) {\n  const [ex, code] = s.split(':');\n  return code + (ex === 'BSE' ? '.BO' : '.NS');\n}\n// NSE:RELIANCE -> NSE:RELIANCE   BSE:500325 -> BOM:500325\nfunction googleSymbol(s) {\n  const [ex, code] = s.split(':');\n  return (ex === 'BSE' ? 'BOM:' : 'NSE:') + code;\n}\n\nfunction fromYahoo(list, out) {\n  const miss = [];\n  let res = [];\n  try {\n    res = UrlFetchApp.fetchAll(list.map(s => ({\n      url: 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(yahooSymbol(s)) + '?range=1d&interval=1d',\n      muteHttpExceptions: true\n    })));\n  } catch (err) { return list.slice(); }\n  res.forEach((r, i) => {\n    try {\n      if (r.getResponseCode() !== 200) throw 0;\n      const m = JSON.parse(r.getContentText()).chart.result[0].meta;\n      const p = Number(m.regularMarketPrice);\n      if (!(p > 0)) throw 0;\n      const pc = Number(m.chartPreviousClose || m.previousClose);\n      out[list[i]] = {p: p, pc: pc > 0 ? pc : null, t: m.regularMarketTime ? m.regularMarketTime * 1000 : Date.now(), src: 'y'};\n    } catch (_) { miss.push(list[i]); }\n  });\n  return miss;\n}\n\n// Backup: write GOOGLEFINANCE formulas into a private sheet in your Drive and read the results.\nfunction fromGoogleFinance(list, out) {\n  const lock = LockService.getScriptLock();\n  if (!lock.tryLock(20000)) return;\n  try {\n    const sh = priceSheet();\n    sh.clearContents();\n    sh.getRange(1, 1, list.length, 2).setFormulas(list.map(s => {\n      const g = googleSymbol(s);\n      return ['=GOOGLEFINANCE(\"' + g + '\",\"price\")', '=GOOGLEFINANCE(\"' + g + '\",\"closeyest\")'];\n    }));\n    SpreadsheetApp.flush();\n    const v = sh.getRange(1, 1, list.length, 2).getValues();\n    v.forEach((row, i) => {\n      if (typeof row[0] === 'number' && row[0] > 0) {\n        out[list[i]] = {p: row[0], pc: typeof row[1] === 'number' && row[1] > 0 ? row[1] : null, t: Date.now(), src: 'g'};\n      }\n    });\n  } catch (_) {\n  } finally { lock.releaseLock(); }\n}\n\nfunction priceSheet() {\n  const props = PropertiesService.getScriptProperties();\n  let id = props.getProperty('sheetId'), ss = null;\n  if (id) { try { ss = SpreadsheetApp.openById(id); } catch (_) { ss = null; } }\n  if (!ss) { ss = SpreadsheetApp.create('DARK-SATIN prices (used by the price helper)'); props.setProperty('sheetId', ss.getId()); }\n  return ss.getSheets()[0];\n}\n\n// Optional: run this once from the editor (select \"test\" \u2192 Run) to check it works.\nfunction test() {\n  const r = doGet({parameter: {s: 'NSE:RELIANCE,NSE:TCS,BSE:500325'}});\n  Logger.log(r.getContent());\n}\n";

function monthsLeft(bal, rate, emi){ const r = rate / 1200; if (!r) return bal / emi; const x = 1 - bal * r / emi; return x <= 0 ? 999 : -Math.log(x) / Math.log(1 + r); }
function payEmi(l){

  toast(`EMI recorded · owed now ${money(bal - principal)}`, () => { D.transactions = D.transactions.filter(t => t.id !== id); });
}

/* ---------- JOURNAL ---------- */
function jEntry(d, create){ let e = D.journal[d]; if (!e && create) e = D.journal[d] = {text:'', plan:'', mood:0, planSent:[], updated:Date.now()}; return e; }
function cleanEntry(d){ const e = D.journal[d]; if (e && !e.text.trim() && !e.plan.trim() && !e.mood) delete D.journal[d]; }
function unsentPlan(d){
  const e = D.journal[d]; if (!e) return [];
  const sent = new Set(e.planSent || []);
  return (e.plan || '').split('\n').map(s => s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(s => s && !sent.has(s));
}
function vJournal(){
  if (journalLocked()) return journalLockHtml();
  const d = S.jDate, t = today(), e = D.journal[d] || {text:'', plan:'', mood:0};
  const recent = Object.keys(D.journal).filter(k => k !== d && !D.journal[k].locked).sort().reverse().slice(0, 20);
  return `
  <div class="datebar"><button data-act="jday" data-n="-1" aria-label="Previous day">‹</button><div><b>${relLabel(d)}</b><small>${fmtLong(d)}</small></div><button data-act="jday" data-n="1" ${d>=t?'disabled':''} aria-label="Next day">›</button></div>
  <div class="moods">${MOODS.map((m,i) => `<button class="mood ${e.mood===i+1?'on':''}" data-act="mood" data-v="${i+1}">${m}</button>`).join('')}</div>
  <textarea id="jText" class="jt" placeholder="What happened today? What's on your mind?">${esc(e.text)}</textarea>
  <div class="jlabel"><h3>Plan for ${d===t ? 'tomorrow' : relLabel(addDays(d,1))}</h3><span class="saved" id="jSaved"></span></div>
  <textarea id="jPlan" class="jt jp" placeholder="One item per line">${esc(e.plan)}</textarea>
  <button class="btn ghost" id="planBtn" style="width:100%;margin-top:10px" data-act="planToTasks"></button>
  <div style="margin-top:22px">${insightsHtml()}</div>
  ${D.journalCrypto ? '<p class="hint" style="text-align:center;margin:-2px 0 8px">🔒 Encrypted on this phone · <button class="link" data-act="jLockNow">Lock now</button></p>' : ''}
  ${recent.length ? `<h3 style="margin:26px 2px 10px">Earlier entries</h3>` + recent.map(k => { const r = D.journal[k]; return `<button class="jentry" data-act="jopen" data-d="${k}"><b>${r.mood ? MOODS[r.mood-1] + ' ' : ''}${relLabel(k)}</b><p>${esc((r.text || r.plan || '').slice(0,160)) || '—'}</p></button>`; }).join('') : ''}`;
}
let jTimer = null;
function flushJournal(){
  if (S.tab !== 'journal') return;
  const tx = $('#jText'), pl = $('#jPlan'); if (!tx) return;
  clearTimeout(jTimer);
  const text = tx.value, plan = pl.value;
  if (!D.journal[S.jDate] && !text.trim() && !plan.trim()) return;
  const e = jEntry(S.jDate, true);
  if (e.text === text && e.plan === plan) return;

}
function updatePlanBtn(){

}
function bindJournal(){

    $(sel).addEventListener('input', () => {

function planToTasks(){

  const e = jEntry(S.jDate, true), due = addDays(S.jDate, 1);

/* ---------- TASKS ---------- */
const byDue = (a,b) => ((a.due||'9999') + (a.time||'99')).localeCompare((b.due||'9999') + (b.time||'99')) || (a.priority - b.priority);
function dueBadge(x){
  if (!x.due) return '';
  const t = today(), tm = x.time ? ' · ' + fmtTime(x.time) : '';
  if (x.done) return `<span>${relLabel(x.due)}</span>`;
  if (x.due < t) return `<span class="due-over">Overdue · ${relLabel(x.due)}</span>`;
  if (x.due === t) return `<span class="due-today">Today${tm}</span>`;
  return `<span>${relLabel(x.due)}${tm}</span>`;
}
function taskRow(x){
  const pn = (S.proj === 'all' && D.projects.length > 1) ? `<span>${esc(D.projects.find(p => p.id === x.project)?.name || '')}</span>` : '';
  const rp = (x.repeat && !x.done ? `<span>↻ ${FREQ[x.repeat]}</span>` : '') + (remindAt(x) !== null && remindAt(x) > Date.now() ? `<span class="bell">🔔 ${(REMIND.find(r => r[0] === String(x.remind)) || ['', ''])[1].replace('At the time', 'On time')}</span>` : '');
  return `<div class="task ${x.done?'done':''}"><button class="chk" data-act="toggleTask" data-id="${x.id}" aria-label="Mark done">${x.done?'✓':''}</button><div class="tmain" data-act="editTask" data-id="${x.id}"><div class="ttl">${esc(x.title)}</div><div class="meta">${dueBadge(x)}${rp}${pn}</div></div><span class="pri p${x.priority}"></span></div>`;
}
// Tick a task. A repeating task creates its next copy; un-ticking removes that copy again.
function toggleTask(t){
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  if (t.done && t.repeat && !t.spawned) {
    const base = t.due || today(), anchor = t.anchor || parseD(base).getDate();
    let n = nextDate(base, t.repeat, anchor), g = 0;
    while (n < today() && g++ < 1000) n = nextDate(n, t.repeat, anchor);
    const nid = uid_();
    D.tasks.push({...t, id:nid, done:false, doneAt:null, spawned:null, anchor, due:n, created:Date.now()});
    t.spawned = nid;
    return `Done ✓  Next: ${relLabel(n)}`;
  }
  if (!t.done && t.spawned) {
    const s = live(D.tasks, t.spawned);
    if (s && !s.done) D.tasks = D.tasks.filter(x => x.id !== t.spawned);
    t.spawned = null;
  }
  return t.done ? 'Done ✓' : '';
}
function vTasks(){
  const t = today(), inP = x => S.proj === 'all' || x.project === S.proj;
  const open = D.tasks.filter(x => !x.done && inP(x));
  const n = {today:open.filter(x => x.due && x.due <= t).length, upcoming:open.filter(x => x.due && x.due > t).length, all:open.length};
  let list, grouped = false;
  switch (S.taskFilter) {
    case 'today': list = open.filter(x => x.due && x.due <= t).sort(byDue); break;
    case 'upcoming': list = open.filter(x => x.due && x.due > t).sort(byDue); grouped = true; break;
    case 'all': list = open.slice().sort(byDue); grouped = true; break;
    default: list = D.tasks.filter(x => x.done && inP(x)).sort((a,b) => (b.doneAt||0) - (a.doneAt||0)).slice(0, 60);
  }
  const seg = [['today','Today'],['upcoming','Upcoming'],['all','All'],['done','Done']]
    .map(([k,l]) => `<button class="${S.taskFilter===k?'on':''}" data-act="tfilter" data-v="${k}">${l}${n[k] ? ` <em>${n[k]}</em>` : ''}</button>`).join('');
  const chips = `<button class="chip ${S.proj==='all'?'on':''}" data-act="proj" data-v="all">All</button>`
    + D.projects.map(p => `<button class="chip ${S.proj===p.id?'on':''}" data-act="proj" data-v="${p.id}">${esc(p.name)}</button>`).join('')
    + (S.proj !== 'all' ? `<button class="chip dash" data-act="editProject" data-id="${S.proj}">✎ Edit</button>` : '')
    + `<button class="chip dash" data-act="newProject">+ Project</button>`;
  let body;
  if (!list.length) body = `<p class="empty card">${({today:'Clear for today.', upcoming:'Nothing scheduled ahead.', all:'No open tasks.', done:'Nothing finished yet.'})[S.taskFilter]}</p>`;
  else if (grouped) {
    let cur = null; body = '<div class="card">';
    list.forEach(x => { const g = x.due ? (x.due < t ? 'Overdue' : relLabel(x.due)) : 'No date'; if (g !== cur) { body += `<div class="dgroup">${g}</div>`; cur = g; } body += taskRow(x); });
    body += '</div>';
  } else body = `<div class="card">${list.map(taskRow).join('')}</div>`;
  return `<div class="seg">${seg}</div><div class="chips">${chips}</div>${body}`;
}

      if (lockCfg.bio) { lockCfg.bio = null; saveLock(); el.textContent = 'Turn on'; toast('Fingerprint off. PIN only.'); break; }
      if (!(await bioAvailable())) { toast("This phone's browser can't use fingerprint here"); break; }
      try { lockCfg.bio = await bioRegister(); saveLock(); el.textContent = 'Turn off'; toast('Fingerprint is on'); }
      catch (_) { toast('Fingerprint was not set up'); }
      break;
    }
    case 'editTask': taskForm(live(D.tasks, id)); break;
    case 'tfilter': S.taskFilter = el.dataset.v; render(); break;
    case 'proj': S.proj = el.dataset.v; render(); break;
    case 'newProject': projectForm(null); break;
    case 'editProject': projectForm(live(D.projects, id)); break;
    case 'jday': flushJournal(); S.jDate = addDays(S.jDate, +el.dataset.n); render(); break;
    case 'jopen': flushJournal(); if ($('#sheetBg').classList.contains('open')) closeSheet(); S.tab = 'journal'; S.jDate = el.dataset.d; render(); scrollTo(0,0); break;
    // trading
    // wealth
    case 'gowealth': S.tab = 'money'; S.moneyView = 'wealth'; S.wView = 'bs'; render(); scrollTo(0,0); break;
    case 'wview': S.wView = el.dataset.v; render(); break;
    case 'incomeTypes': incomeTypesForm(); break;
    case 'holding': { const x = live(D.holdings, id); if (x) holdingSheet(x); break; }
    case 'addHolding': holdingForm(null); break;
    case 'hEdit': { const x = live(D.holdings, id); if (x) holdingForm(x); break; }
    case 'hBuy': case 'hSell': { const x = live(D.holdings, id); if (x) tradeHoldingForm(x, el.dataset.act === 'hSell'); break; }
    case 'updPrices': pricesForm(); break;
    case 'priceSetup': priceSetupForm(); break;
    case 'refreshAll': { toast('Refreshing prices…'); const [a, b] = await Promise.all([refreshPrices(true), refreshNavs(true)]); toast(a === null ? (priceErr || 'Couldn\'t refresh') : `Updated ${(a || 0) + (b || 0)} price${(a || 0) + (b || 0) === 1 ? '' : 's'}`); break; }
    case 'copyHelper': try { await navigator.clipboard.writeText(HELPER_CODE); toast('Helper code copied'); } catch (_) { toast('Copy failed. Use the price-helper.gs file instead'); } break;
    case 'priceOff': if (confirm('Turn off live prices? Your holdings keep their last price.')) { D.priceUrl = ''; save(); closeSheet(); render(); toast('Live prices off'); } break;
    case 'testPrice': {
      const u = ($('#sf')?.elements.url.value || '').trim(), out = $('#ptest'); if (!u) { toast('Paste the link first'); break; }
      out.textContent = 'Testing…';
      try { const q = await fetchPrices(u, ['NSE:RELIANCE']), p = q['NSE:RELIANCE']; out.innerHTML = p ? `✅ Working. RELIANCE ${money(+p.p)} (${p.src === 'g' ? 'Google Finance' : 'Yahoo'})` : '⚠ The helper answered but had no price. Try again in a minute.'; }
      catch (_) { out.innerHTML = '<span class="neg">✖ Could not reach it. Check that access is set to "Anyone" and the link ends in /exec.</span>'; }
      break;
    }
    case 'refreshNav': { toast('Refreshing NAVs…'); const n = await refreshNavs(true); toast(n ? `${n} NAV${n > 1 ? 's' : ''} updated` : "Couldn't update NAVs right now"); break; }
    case 'mfSearch': mfSearch(); break;
    case 'mfPick': { const f = $('#sf'); f.elements.code.value = el.dataset.code; f.elements.name.value = el.dataset.name; $('#mfres').innerHTML = `<p class="hint">✓ ${esc(el.dataset.name)}</p>`; break; }
    case 'addOther': otherForm(null); break;
    case 'editOther': { const o = live(D.others, id); if (o) otherForm(o); break; }
    case 'addLoan': loanForm(null); break;
    case 'loan': { const l = live(D.loans, id); if (l) loanSheet(l); break; }
    case 'editLoan': { const l = live(D.loans, id); if (l) loanForm(l); break; }
    case 'payEmi': { const l = live(D.loans, id); if (l) payEmi(l); break; }
    case 'tmonth': S.tym = addMonths(S.tym, +el.dataset.n); render(); break;
    case 'tradeDay': tradeDaySheet(el.dataset.d); break;
    case 'editTrade': { const t = live(D.trades, id); if (t) tradeForm(t); break; }
    case 'addTradeOn': tradeForm(null, el.dataset.d); break;
    case 'tradeSettings': tradeSettingsForm(); break;
    // search
    case 'search': searchSheet(); break;
    case 'qTxn': { const t = live(D.transactions, id); if (t) (t.auto === 'trading' ? tradeDaySheet(t.date) : txnForm(t)); break; }
    case 'qTask': { const t = live(D.tasks, id); if (t) taskForm(t); break; }
    case 'qTrade': { const t = live(D.trades, id); if (t) tradeForm(t); break; }
    // journal encryption
    case 'jForgot': forgotCrypto(); break;
    case 'jCryptoOn': cryptoForm(); break;
    case 'jCryptoOff': if (confirm('Turn off encryption? Your journal will be saved as plain text again.')) { await disableCrypto(); closeSheet(); render(); toast('Journal encryption is off'); } break;
    case 'jLockNow': if ($('#sheetBg').classList.contains('open')) closeSheet(); await lockJournalNow(); break;
    case 'tabJournal': closeSheet(); S.tab = 'journal'; render(); break;
    // bank import
    case 'openImport': importStart(); break;
    case 'impPick': busyUntil = Date.now() + 120000; $('#impFile').click(); break;
    case 'impGo': importGo(); break;
    case 'mood': { flushJournal(); const en = jEntry(S.jDate, true), v = +el.dataset.v; en.mood = en.mood === v ? 0 : v; en.updated = Date.now(); cleanEntry(S.jDate); save(); render(); break; }
    case 'planToTasks': planToTasks(); break;
    case 'fab': fab(); break;
    case 'quick': { const v = el.dataset.v; if (v === 'task') taskForm(null); else if (v === 'journal') { closeSheet(); S.tab = 'journal'; S.jDate = today(); render(); } else txnForm(null, v); break; }
    case 'settings': settingsForm(); break;
    case 'closeSheet': closeSheet(); break;
    case 'theme': toggleTheme(); el.textContent = theme === 'dark' ? 'Switch to light' : 'Switch to dark'; break;
    case 'export': exportData(); break;
    case 'import': busyUntil = Date.now() + 120000; $('#importFile').click(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lockAfter' && lockCfg) { lockCfg.after = +e.target.value; saveLock(); toast('Saved'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'mfq') { e.preventDefault(); mfSearch(); } });
document.addEventListener('keydown', e => {
  if (!locked) return;
  if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del');
});
// Lock when the app comes back after being away; add any recurring entries that came due.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    flushJournal();
    if (!lockCfg || Date.now() < busyUntil) return;          // a fingerprint prompt or file picker is open
    hiddenAt = Date.now();
    if (!(lockCfg.after > 0)) showLock();                     // "Immediately": cover the screen before the app switcher snapshot
    return;
  }
  const wasLocked = locked;
  if (lockCfg && hiddenAt && Date.now() - hiddenAt >= (lockCfg.after || 0) * 1000) showLock();   // offers fingerprint itself
  if (wasLocked && locked && lockCfg?.bio && Date.now() >= busyUntil) setTimeout(bioUnlock, 300);
  hiddenAt = 0;
  if (ready) { const n = runRecurring(); save(); if (n) { render(); toast(`${n} recurring entr${n > 1 ? 'ies' : 'y'} added`); } }
});
addEventListener('pagehide', flushJournal);

/* ---------- start ---------- */
if (!configured) gate('setup');
else {
  gate('loading');
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}), ignoreUndefinedProperties: true});
  onAuthStateChanged(auth, u => {
    if (!u) { if (user) location.reload(); else gate('signin'); return; }
    if (!u.emailVerified) { gate('verify', {email: u.email}); return; }
    startUser(u);
  });
}
</script>
</body>
</html>
